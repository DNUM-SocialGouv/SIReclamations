name: Dependency-Check Analysis (SCA)

on:
  schedule:
    - cron: "0 23 * * 1"

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run OWASP Dependency-Check
      run: |
        mvn dependency-check:check \
          -Dformat=HTML \
          -Dnvd.api.key=${{ secrets.NVD_API_KEY }} \
          -Ddependency-check.failBuildOnCVSS=7.0

    - name: Upload Dependency-Check HTML report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-html-report
        path: target/dependency-check-report/dependency-check-report.html
