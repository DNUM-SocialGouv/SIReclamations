apiVersion: v1
kind: Pod
metadata:
  labels:
    run: sireclamations
  name: sireclamations
  namespace: default
spec:
  containers:
    - env:
        - name: DEMAT_SOCIAL_GRAPHQL_TOKEN
          valueFrom:
            secretKeyRef:
              key: DEMAT_SOCIAL_GRAPHQL_TOKEN
              name: sireclamations-secret
      image: sireclamations:latest
      imagePullPolicy: Never
      name: sireclamations
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /health/readiness
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 30
      volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-sb8xx
          readOnly: true
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  serviceAccountName: default
  tolerations:
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 300
  volumes:
    - name: kube-api-access-sb8xx
      projected:
        sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              items:
                - key: ca.crt
                  path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
                - fieldRef:
                    fieldPath: metadata.namespace
                  path: namespace
